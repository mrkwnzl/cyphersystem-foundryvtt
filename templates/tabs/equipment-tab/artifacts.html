<div class="flexrow">
  <ol class="items-list">
    <li class="item flexrow item-header">
      <div class="item-name">
        {{#if (eq actor.system.settings.equipment.artifacts.label "")}}
          {{localize 'CYPHERSYSTEM.Artifacts'}}
        {{else}}
          {{actor.system.settings.equipment.artifacts.label}}
        {{/if}}
      </div>
      <div class="item-quantity">{{localize 'CYPHERSYSTEM.Level'}}</div>
      <div class="item-controls flexrow">
        <a class="item-control {{disabled ./sheetSettings.isObserver}}" title="{{localize 'CYPHERSYSTEM.CreateItem'}}" data-type="artifact" data-action="itemCreate">
          <i class="fa-item fas fa-plus"></i>
        </a>
      </div>
    </li>
    {{> systems/cyphersystem/templates/item-lists/artifacts-list.html}}
  </ol>
</div>
