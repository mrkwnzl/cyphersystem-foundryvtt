<div class="flexrow">
  <ol class="items-list">
    <li class="item flexrow item-header">
      <div class="item-name">{{localize 'CYPHERSYSTEM.Attacks'}}</div>
      <div class="item-quantity">{{localize 'CYPHERSYSTEM.Damage'}}</div>
      <div class="item-controls flexrow">
        <a class="item-control {{disabled ./sheetSettings.isObserver}}" title="{{localize 'CYPHERSYSTEM.CreateItem'}}" data-type="attack" data-action="itemCreate">
          <i class="fa-item fas fa-plus"></i>
        </a>
      </div>
    </li>
    {{#if (eq actor.system.basic.unmaskedForm "Teen")}}
      {{> systems/cyphersystem/templates/item-lists/attacks-list-teen.html}}
    {{else}}
      {{> systems/cyphersystem/templates/item-lists/attacks-list.html}}
    {{/if}}
  </ol>
</div>
